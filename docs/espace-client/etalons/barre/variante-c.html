<!doctype html>
<html lang="fr" class="dark scroll-pt-28">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Étalon barre, variante C : Mon compte (local, ne pas déployer)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
/* Tokens réels de apps/web/tailwind.config.ts (couleurs, polices, rayons, animation fade-in). */
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: {
      background: { DEFAULT: "#0D0D0D", light: "#1A1A1A", card: "#1F1F1F", elevated: "#2A2A2A" },
      accent: { primary: "#8B5CF6", "primary-hover": "#A78BFA", secondary: "#6D28D9", "secondary-hover": "#7C3AED", link: "#A78BFA" },
      text: { primary: "#FFFFFF", secondary: "#B3B3B3", muted: "#9A9A9A" },
      border: { DEFAULT: "#2A2A2A", hover: "#3A3A3A", input: "#707070" },
      success: "#22C55E", error: "#EF4444", "error-text": "#F87171", warning: "#F59E0B"
    },
    fontFamily: {
      sans: ["var(--font-inter)", "Inter", "system-ui", "sans-serif"],
      display: ["var(--font-display)", "Plus Jakarta Sans", "Inter", "system-ui", "sans-serif"]
    },
    borderRadius: { lg: "0.75rem", md: "0.5rem", sm: "0.25rem" },
    animation: { "fade-in": "fadeIn 0.3s ease-in-out" },
    keyframes: { fadeIn: { "0%": { opacity: "0" }, "100%": { opacity: "1" } } }
  } }
};
</script>
<style type="text/tailwindcss">
  :root { --font-inter: "Inter"; --font-display: "Plus Jakarta Sans"; color-scheme: dark; }
  @layer base {
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body { background-color: #0D0D0D; color: #FFFFFF; line-height: 1.6; min-height: 100vh; }
  }
  @layer components {
    .text-gradient { @apply bg-gradient-to-r from-accent-primary-hover to-accent-secondary-hover bg-clip-text text-transparent; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }
</style>
</head>
<body class="bg-background font-sans text-text-primary antialiased">

<!-- EN-TETE DE L'ABONNE : classes de header.tsx, sans le nav desktop ; blocs de droite groupes ; menu de compte a toutes les largeurs -->
<header class="sticky top-0 z-50 border-b border-border bg-background/95 backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-2 px-3 min-[360px]:px-4 sm:gap-4 md:px-6 xl:px-8">
    <a href="#" class="flex min-h-11 shrink-0 items-center gap-2">
      <span class="whitespace-nowrap font-display text-sm font-bold text-gradient min-[360px]:text-base min-[400px]:text-lg sm:text-xl">deviens-marrant.fr</span>
    </a>
    <div class="ml-auto flex items-center gap-1 xl:gap-3">
      <!-- Recherche : approximation de SearchBar (composant non relu) -->
      <div class="relative hidden w-44 shrink-0 xl:block">
        <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-text-muted" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="search" aria-label="Rechercher" placeholder="Rechercher..." class="h-11 w-full rounded-lg border border-border-input bg-background-light pl-9 pr-3 text-sm text-text-primary placeholder:text-text-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-primary">
      </div>
      <button type="button" aria-label="Rechercher" class="hidden h-11 w-11 shrink-0 items-center justify-center rounded-lg text-text-secondary transition-colors hover:bg-background-elevated focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-primary min-[440px]:flex xl:hidden">
        <svg class="h-5 w-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </button>
      <!-- Menu de compte (AccountMenu) -->
      <div class="relative">
        <button id="btn-compte" type="button" aria-label="Menu du compte" aria-expanded="false" aria-haspopup="menu" aria-controls="menu-compte" class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-lg px-0 text-sm font-semibold text-text-secondary transition-colors hover:bg-background-elevated hover:text-text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-primary focus-visible:ring-offset-2 focus-visible:ring-offset-background aria-expanded:bg-background-elevated">
          <svg class="h-5 w-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </button>
        <div id="menu-compte" role="menu" class="hidden absolute right-0 top-full z-[60] mt-2 min-w-[12rem] rounded-lg border border-border bg-background-card p-1 shadow-xl animate-fade-in"></div>
      </div>
    </div>
  </div>
</header>

<!-- BARRE DE RUBRIQUES : sticky top-16 (sous l'en-tete), 1 + 44 + 1 px -->
<div class="sticky top-16 z-40 border-b border-border bg-background pt-px">
  <nav id="barre" class="mx-auto flex h-11 max-w-7xl items-stretch px-3 min-[360px]:px-4 md:px-6 xl:px-8">
    <div class="relative -ml-3 min-w-0 flex-1 lg:flex-none">
      <div id="liste" class="flex h-11 snap-x snap-proximity items-stretch overflow-x-auto overscroll-x-contain scroll-px-8 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"></div>
      <div id="fondu-g" aria-hidden="true" class="pointer-events-none absolute inset-y-0 left-0 w-8 bg-gradient-to-r from-background to-transparent opacity-0 transition-opacity lg:hidden"></div>
      <div id="fondu-d" aria-hidden="true" class="pointer-events-none absolute inset-y-0 right-0 w-8 bg-gradient-to-l from-background to-transparent transition-opacity lg:hidden"></div>
    </div>
    <div class="relative shrink-0">
      <button id="btn-plus" type="button" aria-expanded="false" aria-haspopup="menu" aria-controls="menu-plus"></button>
      <div id="menu-plus" role="menu" aria-label="Plus de rubriques" class="hidden absolute right-0 top-full z-[60] mt-2 max-h-[calc(100dvh-8rem)] min-w-[12rem] overflow-y-auto rounded-lg border border-border bg-background-card p-1 shadow-xl animate-fade-in"></div>
    </div>
  </nav>
</div>

<!-- HAUT DE PAGE PUBLIQUE /vannes vue par l'abonne (contexte, sans contenu inventé) -->
<main id="main-content" class="mx-auto max-w-7xl px-3 py-8 min-[360px]:px-4 md:px-6 xl:px-8">
  <p class="text-sm text-text-muted">Étalon local, haut de page /vannes vu par un abonné connecté. Ne pas déployer.</p>
  <h1 class="mt-2 font-display text-3xl font-bold md:text-4xl">Vannes</h1>
  <p class="mt-4 text-sm text-text-secondary">États de l'étalon :
    <a class="rounded-sm text-accent-link underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-primary" href="#plus">Plus ouvert</a>,
    <a class="rounded-sm text-accent-link underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-primary" href="#compte">Menu de compte ouvert</a>,
    <a class="rounded-sm text-accent-link underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-primary" href="#actif=/carnet">Actif dans Plus (Carnet)</a>,
    <a class="rounded-sm text-accent-link underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-primary" href="#actif=/videos">Actif : Vidéos</a>.
  </p>
  <div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-hidden="true">
    <div class="rounded-lg border border-border bg-background-card p-4"><div class="h-4 w-2/3 rounded-sm bg-background-elevated"></div><div class="mt-3 h-3 w-full rounded-sm bg-background-elevated"></div><div class="mt-2 h-3 w-5/6 rounded-sm bg-background-elevated"></div></div>
    <div class="rounded-lg border border-border bg-background-card p-4"><div class="h-4 w-1/2 rounded-sm bg-background-elevated"></div><div class="mt-3 h-3 w-full rounded-sm bg-background-elevated"></div><div class="mt-2 h-3 w-4/6 rounded-sm bg-background-elevated"></div></div>
    <div class="rounded-lg border border-border bg-background-card p-4"><div class="h-4 w-3/4 rounded-sm bg-background-elevated"></div><div class="mt-3 h-3 w-full rounded-sm bg-background-elevated"></div><div class="mt-2 h-3 w-3/6 rounded-sm bg-background-elevated"></div></div>
    <div class="rounded-lg border border-border bg-background-card p-4"><div class="h-4 w-2/5 rounded-sm bg-background-elevated"></div><div class="mt-3 h-3 w-full rounded-sm bg-background-elevated"></div><div class="mt-2 h-3 w-5/6 rounded-sm bg-background-elevated"></div></div>
    <div class="rounded-lg border border-border bg-background-card p-4"><div class="h-4 w-3/5 rounded-sm bg-background-elevated"></div><div class="mt-3 h-3 w-full rounded-sm bg-background-elevated"></div><div class="mt-2 h-3 w-4/6 rounded-sm bg-background-elevated"></div></div>
    <div class="rounded-lg border border-border bg-background-card p-4"><div class="h-4 w-2/3 rounded-sm bg-background-elevated"></div><div class="mt-3 h-3 w-full rounded-sm bg-background-elevated"></div><div class="mt-2 h-3 w-3/6 rounded-sm bg-background-elevated"></div></div>
  </div>
</main>

<script>
/* VARIANTE C : seules ces donnees changent d'une variante a l'autre. Conflit assume : « Mon compte » (l'espace) a cote de « Mon profil » (les reglages). */
const V = {
  espace: "Mon compte",
  visibles: [["Aujourd'hui", "/mon-espace"], ["Parcours", "/parcours"], ["Vannes", "/vannes"], ["Conseils", "/conseils"], ["Vidéos", "/videos"]],
  plus: [["Carnet", "/carnet"], ["Favoris", "/favoris"], ["Notes", "/mon-espace/notes"], ["Équipe", "/mon-espace/ecrire"], ["Glossaire", "/glossaire"], ["Quiz", "/quiz-humour"], ["Lettre", "/lettre"], ["Articles", "/blog"]],
  labelBarre: "Rubriques du compte"
};
let actif = "/vannes";

const BASE = "relative flex h-11 shrink-0 items-center whitespace-nowrap px-3 text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-accent-primary";
const ON = "text-text-primary after:absolute after:inset-x-3 after:bottom-0 after:h-0.5 after:bg-accent-primary";
const OFF = "text-text-secondary hover:text-text-primary";
const ITEM = "flex min-h-11 w-full cursor-pointer select-none items-center gap-3 rounded-md px-3 text-sm font-medium outline-none transition-colors hover:bg-background-elevated hover:text-text-primary focus-visible:bg-background-elevated focus-visible:text-text-primary";
const ICO = (d) => `<svg class="h-4 w-4" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="${d}"/></svg>`;
const D_ESPACE = "M3 12l9-9 9 9M5 10v10h14V10";
const D_PROFIL = "M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z";
const D_SORTIE = "M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1";
const $ = (s) => document.querySelector(s);
const ouvert = (p) => !p.classList.contains("hidden");

function basculer(btn, panneau, ouvrir) {
  const o = ouvrir === undefined ? !ouvert(panneau) : ouvrir;
  panneau.classList.toggle("hidden", !o);
  btn.setAttribute("aria-expanded", String(o));
}
function fermerTout(rendreFocus) {
  [["#btn-plus", "#menu-plus"], ["#btn-compte", "#menu-compte"]].forEach(([b, p]) => {
    if (ouvert($(p)) && rendreFocus) $(b).focus();
    basculer($(b), $(p), false);
  });
}

function dessiner() {
  $("#barre").setAttribute("aria-label", V.labelBarre);
  $("#liste").innerHTML = V.visibles.map(([l, h]) => {
    const a = actif === h;
    return `<a href="#actif=${h}" data-h="${h}" class="${BASE} snap-start ${a ? ON : OFF}"${a ? ' aria-current="page"' : ""}>${l}</a>`;
  }).join("");
  const plusActif = V.plus.some(([, h]) => h === actif);
  const b = $("#btn-plus");
  b.className = `${BASE} gap-1 border-l border-border lg:border-l-0 ${plusActif ? ON : OFF}`;
  if (plusActif) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
  b.innerHTML = `Plus <svg class="h-4 w-4" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>`;
  $("#menu-plus").innerHTML = V.plus.map(([l, h]) => {
    const a = actif === h;
    return `<a role="menuitem" href="#actif=${h}" data-h="${h}" class="${ITEM} ${a ? "bg-background-elevated text-text-primary" : "text-text-secondary"}"${a ? ' aria-current="page"' : ""}>${l}</a>`;
  }).join("");
  $("#menu-compte").innerHTML =
    `<a role="menuitem" href="#actif=/mon-espace" data-h="/mon-espace" class="${ITEM} text-text-secondary">${ICO(D_ESPACE)}${V.espace}</a>` +
    `<a role="menuitem" href="#" class="${ITEM} text-text-secondary">${ICO(D_PROFIL)}Mon profil</a>` +
    `<div role="separator" class="my-1 h-px bg-border"></div>` +
    `<a role="menuitem" href="#" class="${ITEM} text-text-secondary">${ICO(D_SORTIE)}Déconnexion</a>`;
  ramener();
}

/* Rubrique active ramenee dans la vue, fondus de bord. */
function ramener() {
  const l = $("#liste"), a = l.querySelector('[aria-current="page"]');
  if (a) l.scrollLeft = Math.max(0, a.offsetLeft - (l.clientWidth - a.offsetWidth) / 2);
  fondus();
}
function fondus() {
  const l = $("#liste");
  $("#fondu-g").classList.toggle("opacity-0", l.scrollLeft < 2);
  $("#fondu-d").classList.toggle("opacity-0", l.scrollLeft + l.clientWidth >= l.scrollWidth - 2);
}

function lireHash() {
  const p = location.hash.slice(1).split("&");
  p.forEach((x) => { if (x.startsWith("actif=")) actif = x.slice(6); });
  dessiner();
  fermerTout(false);
  if (p.includes("plus")) basculer($("#btn-plus"), $("#menu-plus"), true);
  if (p.includes("compte")) basculer($("#btn-compte"), $("#menu-compte"), true);
}

document.addEventListener("click", (e) => {
  const lien = e.target.closest("a[data-h]");
  if (lien) { e.preventDefault(); actif = lien.dataset.h; dessiner(); fermerTout(false); return; }
  if (e.target.closest("#btn-plus")) { basculer($("#btn-compte"), $("#menu-compte"), false); basculer($("#btn-plus"), $("#menu-plus")); return; }
  if (e.target.closest("#btn-compte")) { basculer($("#btn-plus"), $("#menu-plus"), false); basculer($("#btn-compte"), $("#menu-compte")); return; }
  if (!e.target.closest("#menu-plus, #menu-compte")) fermerTout(false);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") fermerTout(true); });
$("#liste").addEventListener("scroll", fondus, { passive: true });
window.addEventListener("resize", ramener);
window.addEventListener("hashchange", lireHash);
lireHash();
</script>
</body>
</html>
