<!doctype html>
<!--
  Maquette navigation v6 (local, ne pas déployer).
  Paramètres : ?etat=visiteur|gratuit|abonne &page=aujourdhui|vannes|apercu &variante=a|b|c|d &menu=1 (ouvre le « … »)
    &rub=aucun (aucune rubrique allumée, cas de l'accueil) | &rub=plus (« … » allumé, cas de Mes questions et Mes répliques)
  Variante D (synthèse des relectures design et UX, C abandonnée) : structure de A (bloc unique, un seul filet en bas)
    + enveloppe de B en plus discret (conteneur arrondi sans bordure en background-light, pleine colonne de contenu,
    « … » poussé à droite), séparateurs 1 px visibles entre les 3 groupes, actif = pastille background-elevated
    ET soulignement violet de 3 px, chips 14 px medium avec survol et anneau de focus, zones de 44 px, fondus gauche
    et droite quand ça défile, « … » avec panneau fini (bordure, ombre, rounded-xl, filet dégradé). Bloc de 109 px.
  Même base pour les 3 variantes : un seul niveau de navigation, mêmes rubriques, même ordre, mêmes états,
  cadenas pour le non-abonné, « … » (Mes questions, Mes répliques), contenu sous la bande identique.
  Variante A « un seul bloc » : en-tête (56 px) et bande (44 px) sur un même fond, un seul filet en bas.
    Bande sans conteneur, libellés 14 px medium gris, actif blanc avec un fin soulignement violet posé sur le filet,
    groupes séparés par de l'espace (pas de traits), cadenas de 12 px discrets. Bloc de 101 px.
  Variante B « pastille raffinée » : l'esprit pastille de la référence, allégé. Conteneur arrondi sans bordure,
    à peine plus clair que le fond, actif en pastille pleine douce teintée de violet, libellés 13 px, rythme de 8 px.
    Zone cliquable de 44 px, pastille visible de 36 px. Bloc de 117 px.
  Variante C « intégré » : dès 1280 px les rubriques montent dans la rangée de l'en-tête (logo, rubriques au centre,
    actions), les moins prioritaires débordent dans « … » (calculé selon la place réelle). Sous 1280 px : bande comme A.
    Un seul étage dès 1280 px (64 px). À 375 px : bande défilante fine comme A.
  Contenus réels du site (captures s25, etalon e5, situations.json) ; textes nouveaux marqués [À VALIDER PAR THOMAS].
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maquette navigation v6 (local, ne pas déployer)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
/* Jetons recopiés de apps/web/tailwind.config.ts (couleurs, rayons, polices, écrans). */
tailwind.config = {
  darkMode: "class",
  theme: {
    screens: { e300:"300px", e360:"360px", e400:"400px", sm:"640px", md:"768px", lg:"1024px", xl:"1280px", "2xl":"1536px" },
    extend: {
      colors: {
        background: { DEFAULT:"#0D0D0D", light:"#1A1A1A", card:"#1F1F1F", elevated:"#2A2A2A" },
        accent: { primary:"#8B5CF6", "primary-hover":"#A78BFA", secondary:"#6D28D9", "secondary-hover":"#7C3AED", link:"#A78BFA" },
        text: { primary:"#FFFFFF", secondary:"#B3B3B3", muted:"#9A9A9A" },
        border: { DEFAULT:"#2A2A2A", hover:"#3A3A3A", input:"#707070" }
      },
      fontFamily: {
        sans: ["Inter","system-ui","sans-serif"],
        display: ["Plus Jakarta Sans","Inter","system-ui","sans-serif"]
      },
      borderRadius: { lg:"0.75rem", md:"0.5rem", sm:"0.25rem" }
    }
  }
};
</script>
<style>
  html{-webkit-font-smoothing:antialiased;scroll-padding-top:128px;color-scheme:dark}
  body{background:#0D0D0D;color:#fff;font-family:Inter,system-ui,sans-serif}
  :focus-visible{outline:2px solid #A78BFA;outline-offset:2px}
  .rub::-webkit-scrollbar{display:none}
  .rub{scrollbar-width:none}
  .chip{position:relative;isolation:isolate;flex:none;display:inline-flex;align-items:center;gap:5px;height:44px;padding:0 12px;color:#B3B3B3;font:500 14px/20px Inter,system-ui,sans-serif;white-space:nowrap;text-decoration:none;transition:color 150ms}
  .chip:hover{color:#fff}
  .chip svg{width:12px;height:12px;flex:none;color:#9A9A9A}
  .chip[aria-current]{color:#fff}
  .chip[aria-current]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px 2px 0 0;background:#8B5CF6}
  .chip:focus-visible{outline-offset:-2px;border-radius:8px}
  .crow .chip{height:64px}
  /* B : pastille douce, 36 px visibles dans une zone de 44 px */
  .vb .chip{font-size:13px;line-height:20px;padding:0 14px;border-radius:9999px}
  .vb .chip[aria-current]::after{content:none}
  .vb .chip[aria-current]::before{content:"";position:absolute;inset:4px 0;z-index:-1;border-radius:9999px;background:rgba(139,92,246,.18)}
  .plusbtn{position:relative;isolation:isolate}
  .plusbtn.on{color:#fff}
  .plusbtn.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;border-radius:2px 2px 0 0;background:#8B5CF6}
  /* D : pastille douce de 36 px dans une zone de 44 px, survol, actif en pastille elevated + soulignement de 3 px */
  .vd .chip{border-radius:8px}
  .vd .chip svg{width:14px;height:14px}
  .vd .plusbtn{border-radius:8px}
  .vd .plusbtn:focus-visible{outline-offset:-2px;border-radius:8px}
  .vd .chip::before,.vd .plusbtn::before{content:"";position:absolute;inset:4px 0;z-index:-1;border-radius:8px;transition:background-color 150ms}
  .vd .chip:hover::before,.vd .plusbtn:hover::before{background:rgba(255,255,255,.05)}
  .vd .chip[aria-current]::before,.vd .plusbtn.on::before{background:#2A2A2A}
  .vd .chip[aria-current]::after,.vd .plusbtn.on::after{left:12px;right:12px;bottom:4px;height:3px}
  .filet{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(to right,#A78BFA,#7C3AED)}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var etat = ["visiteur","gratuit","abonne"].indexOf(q.get("etat"))>=0 ? q.get("etat") : "visiteur";
  var page = ["aujourdhui","vannes","apercu"].indexOf(q.get("page"))>=0 ? q.get("page") : "vannes";
  var V = ["a","b","c","d"].indexOf(q.get("variante"))>=0 ? q.get("variante") : "a";
  var abonne = etat==="abonne";
  document.body.className = "v"+V;
  var OFFRE_LONG = "Premium · 1,99 €/mois"; /* texte réel du bouton d'en-tête (captures s25) */
  var OFFRE_COURT = "Premium";
  var lien = function(p){ return "?etat="+etat+"&page="+p+"&variante="+V; };

  var lock = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 118 0v4"/></svg>';
  var iconSearch = '<svg aria-hidden="true" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>';
  var iconBell = '<svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg>';
  var iconUser = '<svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>';
  var iconMenu = '<svg aria-hidden="true" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>';
  var iconDots = '<svg aria-hidden="true" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';

  /* Rubriques de la spec v6 §1 : ordre unique pour les 3 états */
  var G1 = [["Aujourd’hui","aujourdhui"],["Parcours",null],["Quoi répondre","apercu"],["Bibliothèque",null],["S’entraîner",null]];
  var G2 = [["Vannes","vannes"],["Conseils",null],["Vidéos",null],["Articles",null],["La lettre",null]];
  var G3 = [["Favoris",null],["Carnet",null]];
  var PLUS = ["Mes questions","Mes répliques"];
  var PRIO = ["Aujourd’hui","Vannes","Parcours","Quoi répondre","Conseils","Bibliothèque","S’entraîner","Vidéos","Articles","La lettre","Favoris","Carnet"];
  var actif = {aujourdhui:"Aujourd’hui", vannes:"Vannes", apercu:"Quoi répondre"}[page];
  var rubParam = q.get("rub");
  var plusOn = rubParam==="plus";
  if(rubParam==="aucun" || plusOn){ actif = null; }
  var SW = V==="b" ? 12 : 20; /* espace entre groupes, en px */

  function chip(l, g){
    var prem = g===1 && !abonne;
    var cur = l[0]===actif ? ' aria-current="page"' : '';
    var nom = prem ? ' aria-label="'+l[0]+', rubrique Premium"' : '';
    return '<a class="chip'+(V==="d"?' snap-start':'')+'" data-n="'+l[0]+'" data-g="'+g+'" href="'+(l[1]?lien(l[1]):'#')+'"'+cur+nom+'>'+l[0]+(prem ? lock : '')+'</a>';
  }
  function sp(n){
    if(V==="d"){ return '<span class="sp" data-s="'+n+'" aria-hidden="true" style="flex:none;width:1px;height:20px;margin:0 6px;background:#3A3A3A"></span>'; }
    return '<span class="sp" data-s="'+n+'" aria-hidden="true" style="flex:none;width:'+SW+'px"></span>';
  }
  function seq(){
    return G1.map(function(l){return chip(l,1);}).join('')+sp(1)+G2.map(function(l){return chip(l,2);}).join('')+sp(2)+G3.map(function(l){return chip(l,3);}).join('');
  }
  function dots(row){
    return '<button type="button" aria-label="Plus" aria-haspopup="menu" aria-expanded="false"'+(plusOn?' aria-current="true"':'')+' data-row="'+(row?1:0)+'" class="plusbtn '+(plusOn?'on ':'')+'ml-1'+' inline-flex h-11 w-11 flex-none items-center justify-center '+(V==="b"?'rounded-full':'rounded-lg')+' text-text-secondary hover:text-text-primary">'+iconDots+'</button>';
  }

  var boutonOffre = abonne ? '' :
    '<a href="#" class="inline-flex h-11 items-center justify-center rounded-lg bg-accent-secondary-hover px-3 text-sm font-semibold text-white hover:bg-accent-secondary md:px-4"><span class="md:hidden">'+OFFRE_COURT+'</span><span class="hidden md:inline">'+OFFRE_LONG+'</span></a>';

  var logo = '<a href="'+(abonne?lien("aujourdhui"):'#')+'" class="flex min-h-[44px] flex-none items-center whitespace-nowrap bg-gradient-to-r from-accent-primary-hover to-accent-secondary-hover bg-clip-text font-display text-lg font-bold text-transparent sm:text-xl">deviens-marrant.fr</a>';

  var actions =
    '<div class="flex flex-none items-center gap-1 md:gap-3">'+
      '<div class="relative hidden h-11 w-44 items-center gap-2 rounded-lg border border-border-input bg-background-light px-3 text-sm text-text-secondary md:flex">'+iconSearch+'<span>Rechercher...</span></div>'+
      (etat==="visiteur" ? '<a href="#" class="hidden h-11 items-center px-3 text-sm font-medium text-text-secondary hover:text-text-primary md:inline-flex">Connexion</a>' : '')+
      boutonOffre+
      (abonne ? '<button type="button" aria-label="Notifications, aucune réponse non lue" class="relative inline-flex h-11 w-11 items-center justify-center rounded-lg text-text-secondary hover:bg-background-elevated hover:text-text-primary">'+iconBell+'</button>' : '')+
      (etat!=="visiteur" ? '<button type="button" aria-label="Menu du compte" class="hidden h-11 w-11 items-center justify-center rounded-lg text-text-secondary hover:bg-background-elevated hover:text-text-primary md:inline-flex">'+iconUser+'</button>' : '')+
      '<button type="button" aria-label="Menu" class="inline-flex h-11 w-11 items-center justify-center rounded-lg text-text-secondary hover:bg-background-elevated hover:text-text-primary md:hidden">'+iconMenu+'</button>'+
    '</div>';

  var rowNav = V==="c" ?
    '<nav aria-label="Rubriques" class="hidden min-w-0 flex-1 self-stretch overflow-hidden xl:flex"><div id="rubRow" class="crow flex w-full items-center justify-center">'+seq()+dots(true)+'</div></nav>' : '';

  var wrapPad = 'mx-auto max-w-7xl px-4 md:px-6 xl:px-8';
  var band;
  if(V==="b"){
    band = '<div class="py-2"><nav aria-label="Rubriques" class="'+wrapPad+'"><div id="rub" class="rub flex w-fit max-w-full items-center overflow-x-auto rounded-full bg-white/[.04] px-1">'+seq()+dots(false)+'</div></nav></div>';
  } else if(V==="d"){
    band = '<div class="pb-2 md:pb-3 md:pt-1.5"><nav aria-label="Rubriques" class="'+wrapPad+'"><div class="flex w-full items-center rounded-xl bg-background-light px-1"><div id="rub" class="rub scroll-px-10 flex min-w-0 flex-1 items-center overflow-x-auto">'+seq()+'</div>'+dots(false)+'</div></nav></div>';
  } else {
    band = '<nav aria-label="Rubriques" class="'+wrapPad+(V==="c"?' xl:hidden':'')+'"><div id="rub" class="rub -mx-3 flex items-center overflow-x-auto">'+seq()+dots(false)+'</div></nav>';
  }

  var header =
  '<header class="sticky top-0 z-50 border-b border-border bg-background/95 backdrop-blur-md">'+
    '<div class="'+wrapPad+' flex h-14 items-center justify-between gap-2 '+(V==="c"?'xl:h-16 xl:gap-6':'')+'">'+logo+rowNav+actions+'</div>'+
    band+
  '</header>'+
  '<div id="menu-plus" role="menu" aria-label="Plus de rubriques" hidden class="fixed z-[60] min-w-[200px] '+(V==="d"?'overflow-hidden rounded-xl border border-border bg-background-card p-1 pt-2 shadow-xl shadow-black/60':'rounded-lg border border-border bg-background-card p-1')+'"></div>';

  /* Contenus RÉELS : captures s25 (vannes, accueil), etalon e5/aujourdhui.html, situations.json */
  var cats = ["Toutes","Vie quotidienne","Boulot & Collègues","Couple","Dating","Soirées & Apéro","Famille","Gaming","Autodérision"];
  function carte(texte, hint){
    return '<article class="rounded-xl border border-border bg-background-card p-5"><div class="flex items-center justify-between"><span class="rounded-full bg-accent-secondary/30 px-2.5 py-0.5 text-xs font-medium text-accent-link">Boulot &amp; Collègues</span></div>'+
      '<p class="mt-4 text-base leading-relaxed text-text-primary">'+texte+'</p>'+
      '<div class="mt-4 flex items-center gap-4 text-sm"><span class="font-semibold text-text-secondary">Révéler la chute</span><span class="text-text-muted">'+hint+'</span></div></article>';
  }
  var contenus = {
    vannes:
      '<nav aria-label="Fil d’Ariane" class="text-sm text-text-secondary">Accueil <span class="px-1">/</span> <span class="text-text-primary">Vannes</span></nav>'+
      '<h1 class="mt-4 max-w-3xl font-display text-3xl font-bold leading-tight md:text-4xl">Vannes drôles à ressortir ce soir, pas trois jours plus tard</h1>'+
      '<p class="mt-3 max-w-2xl text-base leading-7 text-text-secondary md:text-lg md:leading-8">Boulot, couple, soirées, famille, gaming : choisis ta situation, clique pour révéler la chute. Avec Premium, tu gardes tes préférées sous le coude. La théorie, c’est bien. Avoir une vanne prête au moment où tout le monde te regarde, c’est mieux.</p>'+
      '<div class="mt-6 flex gap-2 overflow-x-auto pb-1 rub md:flex-wrap md:overflow-visible">'+cats.map(function(c,i){return '<a href="#" class="inline-flex h-11 flex-none items-center rounded-full px-4 text-sm font-medium '+(i===0?'bg-accent-secondary-hover text-white':'bg-background-elevated text-text-secondary hover:text-text-primary')+'">'+c+'</a>';}).join('')+'</div>'+
      '<div class="mt-6 grid gap-4 md:grid-cols-2">'+
        carte('Pour ta valise de départ, chacun a cotisé selon ses moyens. Moi, dix euros.','Clique pour la chute')+
        carte('Mesdames, messieurs, le discours que vous avez demandé est momentanément indisponible.','Parie sur la chute, puis vérifie')+
      '</div>',
    aujourdhui:
      '<h1 class="font-display text-3xl font-bold leading-tight md:text-4xl">Aujourd’hui</h1>'+
      '<section class="relative mt-6 max-w-3xl overflow-hidden rounded-xl border border-border bg-background-card p-5 md:p-6" aria-labelledby="h-pas"><div class="filet"></div>'+
        '<p class="text-xs font-semibold text-text-muted">Ton premier pas</p>'+
        '<h2 id="h-pas" class="mt-3 font-display text-2xl font-bold leading-8">Quelqu’un te lance «&nbsp;Tiens, tu as changé quelque chose, non&nbsp;?&nbsp;»</h2>'+
        '<div class="mt-5 flex items-center gap-4"><span class="text-sm text-text-secondary">5 min</span><a href="#" class="inline-flex h-11 items-center justify-center rounded-lg bg-accent-secondary-hover px-5 text-sm font-semibold text-white hover:bg-accent-secondary">Commencer</a></div>'+
      '</section>',
    apercu:
      '<h1 class="font-display text-3xl font-bold leading-tight md:text-4xl">Quoi répondre</h1>'+
      '<p class="mt-3 max-w-2xl text-base leading-7 text-text-secondary md:text-lg md:leading-8">Voici un exemple de cette rubrique. Elle est ouverte avec Premium. <!-- [À VALIDER PAR THOMAS] sous-titre proposé par la spec v6 §2 --></p>'+
      '<article class="relative mt-6 max-w-3xl overflow-hidden rounded-xl border border-border bg-background-card p-5 md:p-6"><div class="filet"></div>'+
        '<h2 class="font-display text-xl font-bold leading-7">Coloc : la poêle</h2>'+
        '<p class="mt-1 text-sm text-text-secondary">5 min</p>'+
        '<p class="mt-4 text-base leading-7 text-text-secondary">Dimanche, 19 h, la coloc. Ton colocataire sort une poêle de l’évier et la tient du bout des doigts devant les deux autres, comme une pièce à conviction :</p>'+
        '<blockquote class="mt-3 rounded-md border-l-2 border-accent-primary bg-background-light px-4 py-3 text-base leading-7 text-text-primary">Quelqu’un connaît le propriétaire de cette poêle ? Elle est là depuis jeudi.</blockquote>'+
        '<p class="mt-3 text-base leading-7 text-text-secondary">Jeudi, c’était pâtes. Personne d’autre n’a cuisiné.</p>'+
        '<blockquote class="mt-3 rounded-md border-l-2 border-accent-primary bg-background-light px-4 py-3 text-base leading-7 text-text-primary">Elle est à moi. Je la lave, et jeudi n’aura jamais existé.</blockquote>'+
        '<p class="mt-3 text-sm leading-6 text-text-secondary">Tu reconnais tout de suite, avec un trait d’autodérision : tu proposes d’effacer l’affaire. Elle ne vise personne et se ferme toute seule : personne n’a besoin de répondre.</p>'+
        '<div class="mt-6 border-t border-border pt-5"><a href="#" class="inline-flex h-11 items-center justify-center rounded-lg bg-accent-secondary-hover px-5 text-sm font-semibold text-white hover:bg-accent-secondary">'+OFFRE_LONG+'</a></div>'+
      '</article>'
  };

  document.getElementById("app").innerHTML = header +
    '<main class="mx-auto max-w-7xl px-4 pb-16 pt-8 md:px-6 xl:px-8">'+contenus[page]+'</main>';

  /* Bande défilante : rubrique active centrée à l'arrivée (bornes respectées), fondus aux bords */
  var rub = document.getElementById("rub");
  function fondu(){
    if(!rub) return;
    var g = rub.scrollLeft>4, d = rub.scrollLeft < rub.scrollWidth-rub.clientWidth-4;
    var e = V==="d" ? 40 : 24;
    var m = "linear-gradient(to right,"+(g?"transparent 0,#000 "+e+"px":"#000 0")+","+(d?"#000 calc(100% - "+e+"px),transparent 100%":"#000 100%")+")";
    rub.style.webkitMaskImage = rub.style.maskImage = (g||d) ? m : "none";
  }
  function centrer(){
    if(!rub) return;
    var a = rub.querySelector("[aria-current]");
    if(a){
      var x = a.getBoundingClientRect().left - rub.getBoundingClientRect().left + rub.scrollLeft;
      rub.scrollLeft = x - (rub.clientWidth - a.offsetWidth)/2;
    }
    if(V==="d"){
      /* Variante D : s'il reste du contenu à droite, un chip doit être visiblement entamé au bord (jamais un séparateur en dernier) */
      var max = rub.scrollWidth - rub.clientWidth, base = rub.scrollLeft;
      if(base < max-4){
        var bord = rub.getBoundingClientRect().right;
        for(var dx=0; dx<=40; dx+=8){
          rub.scrollLeft = base+dx;
          var coupe = [].some.call(rub.querySelectorAll(".chip"), function(c){
            var r = c.getBoundingClientRect(); return r.left < bord-8 && r.left >= bord-40 && r.right > bord; });
          if(coupe) break;
        }
      }
    }
    fondu();
  }
  if(rub){ rub.addEventListener("scroll", fondu); }
  /* D : l'accroche (snap-x) ne s'active qu'au premier geste, pour ne pas défaire le placement d'arrivée */
  if(rub && V==="d"){
    var accroche = function(){ rub.classList.add("snap-x"); };
    ["pointerdown","touchstart","wheel","keydown"].forEach(function(ev){ rub.addEventListener(ev, accroche, {once:true, passive:true}); });
  }

  /* Variante C : débordement des rubriques les moins prioritaires dans « … » (dès 1280 px) */
  var cache = [];
  function debordement(){
    var row = document.getElementById("rubRow");
    if(!row) return;
    cache = [];
    var chips = [].slice.call(row.querySelectorAll(".chip")), sps = [].slice.call(row.querySelectorAll(".sp"));
    chips.forEach(function(c){ c.style.display=""; });
    sps.forEach(function(s){ s.style.display=""; });
    if(innerWidth<1280) return;
    var btn = row.querySelector(".plusbtn");
    var avail = row.clientWidth - btn.offsetWidth - 4 - 2*SW;
    var par = {}; chips.forEach(function(c){ par[c.dataset.n]=c; });
    var ordre = (actif ? [actif] : []).concat(PRIO.filter(function(n){return n!==actif;}));
    var used = 0, montre = {};
    for(var i=0;i<ordre.length;i++){
      var w = par[ordre[i]].offsetWidth;
      if(used+w>avail) break;
      used += w; montre[ordre[i]] = 1;
    }
    var nb = {1:0,2:0,3:0};
    chips.forEach(function(c){
      if(montre[c.dataset.n]){ nb[c.dataset.g]++; }
      else { c.style.display="none"; cache.push([c.dataset.n, c.dataset.g==="1", c.getAttribute("href")]); }
    });
    sps.forEach(function(s){
      var ok = s.dataset.s==="1" ? (nb[1]>0 && nb[2]+nb[3]>0) : (nb[3]>0 && nb[1]+nb[2]>0);
      s.style.display = ok ? "" : "none";
    });
  }

  /* « … » : liste, Échap ferme, focus rendu */
  var menu = document.getElementById("menu-plus");
  var courant = null;
  function lignes(row){
    var liste = (row ? cache : []).concat(PLUS.map(function(n){ return [n,true,"#"]; }));
    menu.innerHTML = (V==="d" ? '<div class="filet"></div>' : '') + liste.map(function(it){
      var prem = it[1] && !abonne;
      return '<a role="menuitem" href="'+it[2]+'" class="flex h-11 items-center justify-between gap-3 rounded-md px-3 text-sm font-medium text-text-secondary hover:bg-background-elevated hover:text-text-primary">'+it[0]+
        (prem ? '<span style="width:'+(V==="d"?14:12)+'px;height:'+(V==="d"?14:12)+'px;color:#9A9A9A">'+lock.replace('<svg','<svg style="width:'+(V==="d"?14:12)+'px;height:'+(V==="d"?14:12)+'px"')+'</span>' : '')+'</a>';
    }).join('');
  }
  function ouvrir(b, o){
    [].forEach.call(document.querySelectorAll(".plusbtn"), function(x){ x.setAttribute("aria-expanded","false"); });
    menu.hidden = !o;
    if(o){
      courant = b; b.setAttribute("aria-expanded","true");
      lignes(b.dataset.row==="1");
      var r = b.getBoundingClientRect();
      menu.style.top = (r.bottom+(V==="d"?8:4))+"px";
      var mw = menu.offsetWidth;
      menu.style.left = Math.max(8, Math.min(r.right-mw, innerWidth-mw-8))+"px";
    }
  }
  [].forEach.call(document.querySelectorAll(".plusbtn"), function(b){
    b.addEventListener("click", function(){ ouvrir(b, menu.hidden || courant!==b); });
  });
  if(V==="d"){
    /* Clic dehors ferme ; flèches haut et bas (et Début, Fin) entre les lignes ; flèche bas sur « … » ouvre et va à la 1re ligne */
    document.addEventListener("click", function(e){
      if(menu.hidden) return;
      if(menu.contains(e.target) || e.target.closest(".plusbtn")) return;
      ouvrir(courant,false);
    });
    var lignesMenu = function(){ return [].slice.call(menu.querySelectorAll("[role=menuitem]")); };
    menu.addEventListener("keydown", function(e){
      var l = lignesMenu(), i = l.indexOf(document.activeElement), n = -1;
      if(e.key==="ArrowDown") n = (i+1)%l.length;
      else if(e.key==="ArrowUp") n = (i-1+l.length)%l.length;
      else if(e.key==="Home") n = 0;
      else if(e.key==="End") n = l.length-1;
      if(n>=0){ e.preventDefault(); l[n].focus(); }
    });
    [].forEach.call(document.querySelectorAll(".plusbtn"), function(b){
      b.addEventListener("keydown", function(e){
        if(e.key==="ArrowDown"){ e.preventDefault(); if(menu.hidden || courant!==b){ ouvrir(b,true); } var l = lignesMenu(); if(l[0]) l[0].focus(); }
      });
    });
  }
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !menu.hidden){ var b=courant; ouvrir(b,false); b.focus(); } });

  function tout(){ debordement(); centrer(); }
  tout();
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(tout); }
  window.addEventListener("load", tout);
  window.addEventListener("resize", function(){ if(!menu.hidden) ouvrir(courant,false); tout(); });
  if(q.get("menu")==="1"){
    setTimeout(function(){
      var bs = [].slice.call(document.querySelectorAll(".plusbtn"));
      var b = bs.filter(function(x){ return x.offsetParent!==null; })[0] || bs[0];
      ouvrir(b, true);
    }, 150);
  }
})();
</script>
</body>
</html>
