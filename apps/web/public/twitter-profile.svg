<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="bg-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="70%" stop-color="#0D0D0D"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#0D0D0D"/>
  <!-- Subtle center glow -->
  <circle cx="200" cy="200" r="200" fill="url(#bg-glow)" opacity="0.4"/>

  <!-- "dm" logotype -->
  <text x="200" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="180" font-weight="900" fill="url(#text-grad)" text-anchor="middle" letter-spacing="-8">dm</text>
</svg>
