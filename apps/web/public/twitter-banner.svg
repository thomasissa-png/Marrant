<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <!-- Subtle decorative circles -->
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="1500" height="500" fill="url(#bg-grad)"/>

  <!-- Subtle ambient glow effects -->
  <circle cx="1200" cy="150" r="300" fill="url(#glow1)"/>
  <circle cx="300" cy="400" r="250" fill="url(#glow2)"/>

  <!-- Main headline -->
  <text x="750" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" text-anchor="middle" letter-spacing="-1"><tspan fill="#FFFFFF">Deviens la personne</tspan><tspan fill="url(#accent-grad)"> la plus drôle</tspan></text>
  <text x="750" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">du groupe.</text>

  <!-- Subtitle: 3 pillars -->
  <text x="750" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#B3B3B3" text-anchor="middle" letter-spacing="4">VANNES  ·  TECHNIQUES  ·  PARCOURS</text>

  <!-- Website URL bottom right -->
  <text x="1440" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#8B5CF6" text-anchor="end" opacity="0.8">deviens-marrant.fr</text>
</svg>
