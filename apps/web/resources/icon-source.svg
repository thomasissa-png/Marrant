<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="highlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#C4B5FD;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#C4B5FD;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Fond gradient violet -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- Highlight subtil en haut -->
  <rect width="1024" height="1024" fill="url(#highlight)" />

  <!-- Microphone stand-up stylisé -->
  <g transform="translate(512, 512)">
    <!-- Tête du micro (capsule) -->
    <ellipse cx="0" cy="-160" rx="170" ry="220" fill="url(#micGrad)" />

    <!-- Grille du micro (sourire intégré) -->
    <g stroke="#8B5CF6" stroke-width="14" stroke-linecap="round" fill="none">
      <line x1="-110" y1="-220" x2="110" y2="-220" />
      <line x1="-130" y1="-160" x2="130" y2="-160" />
      <line x1="-130" y1="-100" x2="130" y2="-100" />
      <!-- Sourire subtil au centre -->
      <path d="M -80 -50 Q 0 -10 80 -50" stroke-width="18" />
    </g>

    <!-- Manche du micro -->
    <rect x="-30" y="60" width="60" height="180" rx="20" fill="url(#micGrad)" />

    <!-- Base / câble -->
    <ellipse cx="0" cy="270" rx="180" ry="36" fill="#FFFFFF" opacity="0.95" />
    <ellipse cx="0" cy="266" rx="170" ry="28" fill="#E5E7EB" />
  </g>

  <!-- Touche de couleur en bas (signature brand) -->
  <circle cx="850" cy="850" r="60" fill="#FBBF24" opacity="0.85" />
</svg>
