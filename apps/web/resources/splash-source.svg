<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="2732" height="2732" fill="url(#splashBg)" />

  <!-- Logo centré (réutilise icon-source mais à plus petite échelle) -->
  <g transform="translate(1366, 1366) scale(1.5)">
    <ellipse cx="0" cy="-160" rx="170" ry="220" fill="#FFFFFF" />
    <g stroke="#8B5CF6" stroke-width="14" stroke-linecap="round" fill="none">
      <line x1="-110" y1="-220" x2="110" y2="-220" />
      <line x1="-130" y1="-160" x2="130" y2="-160" />
      <line x1="-130" y1="-100" x2="130" y2="-100" />
      <path d="M -80 -50 Q 0 -10 80 -50" stroke-width="18" />
    </g>
    <rect x="-30" y="60" width="60" height="180" rx="20" fill="#FFFFFF" />
    <ellipse cx="0" cy="270" rx="180" ry="36" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Wordmark sous le logo -->
  <text x="1366" y="2050" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="120" fill="#FFFFFF" letter-spacing="-2">
    Deviens Marrant
