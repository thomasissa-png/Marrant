name: Tests CI

# Le repo n'a pas de branche `main` — la branche par défaut est
# `master` et le développement se fait sur des branches `claude/**`
# (une par session). On déclenche donc sur push/PR de toutes ces
# branches pour que la CI tourne quel que soit le workflow.
on:
  push:
    branches:
      - master
      - "claude/**"
  pull_request:
    branches:
      - master
      - "claude/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deviens_marrant_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests
        run: npx jest --ci --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deviens_marrant_test
          ANTHROPIC_API_KEY: dummy
          NEXTAUTH_SECRET: test-secret
          RESEND_API_KEY: re_dummy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deviens_marrant_test
          ANTHROPIC_API_KEY: dummy
          NEXTAUTH_SECRET: test-secret
          RESEND_API_KEY: re_dummy

  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint
